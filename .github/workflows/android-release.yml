name: Android signed release
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Increasing positive Android version code'
        required: true
      version_name:
        description: 'Release version name'
        required: true
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-release
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      FOOTY_VERSION_CODE: ${{ inputs.version_code }}
      FOOTY_VERSION_NAME: ${{ inputs.version_name }}
      FOOTY_GOOGLE_SERVICES_JSON: ${{ secrets.FOOTY_GOOGLE_SERVICES_JSON }}
      FOOTY_PUSH_BACKEND_READY: ${{ vars.FOOTY_PUSH_BACKEND_READY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: node --test ../tests/*.test.mjs
      - run: npm run android:init
      - name: Build with the private release key
        env:
          FOOTY_KEYSTORE_BASE64: ${{ secrets.FOOTY_KEYSTORE_BASE64 }}
          FOOTY_KEYSTORE_PASSWORD: ${{ secrets.FOOTY_KEYSTORE_PASSWORD }}
          FOOTY_KEY_ALIAS: ${{ secrets.FOOTY_KEY_ALIAS }}
          FOOTY_KEY_PASSWORD: ${{ secrets.FOOTY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in FOOTY_KEYSTORE_BASE64 FOOTY_KEYSTORE_PASSWORD FOOTY_KEY_ALIAS FOOTY_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing release signing secret: $name"; exit 1; fi
          done
          export FOOTY_KEYSTORE_PATH="$RUNNER_TEMP/footy-release.jks"
          trap 'rm -f "$FOOTY_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$FOOTY_KEYSTORE_BASE64" | base64 --decode > "$FOOTY_KEYSTORE_PATH"
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease assembleRelease -PfootyRelease --no-daemon
      - name: Verify release is signed and not debuggable
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/footy-apk-metadata"
          if grep -q application-debuggable "$RUNNER_TEMP/footy-apk-metadata"; then echo "::error::Refusing debuggable release"; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Footy-Android-signed-release
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed Android download and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-manifest.mjs
          tag="android-v${FOOTY_VERSION_NAME}-${FOOTY_VERSION_CODE}"
          gh release create "$tag" release-assets/Footy.apk release-assets/Footy.aab release-assets/footy-release.json --repo "$GITHUB_REPOSITORY" --title "Footy Android $FOOTY_VERSION_NAME" --notes "Signed Android release. Install Footy.apk or use Footy.aab for store distribution."
